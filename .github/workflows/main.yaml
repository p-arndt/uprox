name: Build and Publish Release

# Tag pushes only. `stamp release` (or `just release`) bumps package.json, commits,
# tags `<x.y.z>` (no "v" prefix, see .stamp.yml) and pushes; this pipeline is a
# worker, not a controller. It never decides a version.
#
# The shared container-release workflow checks the tag against the committed
# version, pushes ghcr.io/<owner>/uprox:<version> (plus <major>.<minor> and latest
# unless it is a pre-release) and creates the GitHub Release from the notes
# `stamp release` wrote into the annotated tag.
on:
  push:
    tags: ['*']

# Two release runs pushing images and notes for the same tag would race; queue
# them instead (never cancel, a half-cancelled release leaves partial state).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing gets published from a commit that fails the regular CI suite.
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    uses: p-arndt/.github/.github/workflows/container-release.yml@v1
    permissions:
      contents: write
      packages: write
    with:
      image: uprox
      platforms: linux/amd64
      # Inline cache on :latest, as before.
      cache: registry
      verify-tag: true
      changelog: stamp
