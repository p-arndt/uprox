name: CI

# Type check, lint, unit + DB (PGlite) tests and the production build run in the
# shared SvelteKit workflow. The migration drift check and the Postgres-backed
# E2E suite stay local: the shared workflow has no slot for either.
#
# pnpm's version comes from `packageManager` in package.json.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Check, lint, unit/DB tests, build
    uses: p-arndt/.github/.github/workflows/sveltekit-ci.yml@v1
    with:
      # Build-time placeholders: SvelteKit's build imports server modules, and
      # the DB client / better-auth validate env at import time. No real
      # database is contacted during these steps.
      env: |
        POSTGRES_HOST=ci
        POSTGRES_USER=ci
        POSTGRES_PASSWORD=ci
        POSTGRES_DB=ci
        BETTER_AUTH_SECRET=ci-placeholder-secret-not-used-at-runtime
        ORIGIN=http://localhost
      test-command: pnpm test:unit --run && pnpm test:db
      build: true

  drift:
    name: Migration drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # drizzle.config.ts requires these; generate never connects.
      POSTGRES_HOST: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration drift check
        # Generating from the current schema must be a no-op. If drizzle-kit
        # writes a new migration, the schema and ./drizzle are out of sync.
        run: |
          pnpm exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::Schema changed without a committed migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain -- drizzle
            exit 1
          fi

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
      BETTER_AUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789
      # 32 zero bytes, base64: throwaway key for the ephemeral CI database.
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
