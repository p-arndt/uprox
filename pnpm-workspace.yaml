allowBuilds:
  '@prisma/client': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@better-auth/core@1.6.25'
  - '@better-auth/drizzle-adapter@1.6.25'
  - '@better-auth/kysely-adapter@1.6.25'
  - '@better-auth/memory-adapter@1.6.25'
  - '@better-auth/mongo-adapter@1.6.25'
  - '@better-auth/prisma-adapter@1.6.25'
  - '@better-auth/telemetry@1.6.25'
  - '@lucide/svelte@1.26.0 || 1.28.0'
  - better-auth@1.6.25
  - '@playwright/test@1.62.1'
  - '@sveltejs/kit@2.70.2'
  - openai@7.2.0
  - playwright-core@1.62.1
  - playwright@1.62.1
  - vite@8.2.0

# Force a single better-call version. @better-auth/cli (dev-only, still on the
# 1.4.x stack) drags in better-call 1.1.8, which pnpm would otherwise pick as the
# peer for the shared @better-auth/core@1.6.11 instance — but core 1.6.11 needs
# 1.3.5 (it imports kAPIErrorHeaderSymbol, added in 1.3.5). Pin to one version.
overrides:
  better-call: 1.3.5
